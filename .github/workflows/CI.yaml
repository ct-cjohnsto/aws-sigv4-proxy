name: Continuous integration
on:
  push:
    branches:
      - "master"
      - "release/v*"
env:
    STAGING_ECR_REPOSITORY: aws-sigv4-proxy-staging

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish to staging
    runs-on: ubuntu-latest
    outputs:
      commit-short-sha: ${{ steps.staging-info.outputs.commit-short-sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ~1.26.0

      - name: Build
        run: |
          go build -v ./cmd/aws-sigv4-proxy

      - name: Run tests
        run: go test -v ./...

      - name: Get short sha
        id: staging-info
        run: |
            shortSha=$(git rev-parse --short ${{ github.sha }})
            echo "commit-short-sha=$shortSha" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to staging
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.STAGING_ECR_REPOSITORY }}:${{ steps.staging-info.outputs.commit-short-sha }}
          platforms: linux/amd64, linux/arm64
